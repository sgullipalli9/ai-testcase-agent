<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Mini Mart — Sign in</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><strong>Mini Mart</strong></header>
<main>
  <h1>Sign in</h1>
  <form novalidate>
    <label for="username">Username</label>
    <input id="username" name="username" data-testid="username" placeholder="Username" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" data-testid="password" placeholder="Password" autocomplete="current-password">
    <p class="error" role="alert" data-testid="login-error" hidden></p>
    <button type="submit" data-testid="login-button">Sign in</button>
  </form>
</main>
<script type="module">import { loginPage } from '/app.js'; loginPage();</script>
</body>
</html>
